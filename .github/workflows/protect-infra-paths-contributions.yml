name: Protect Infrastructure Directories (Contributions)

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  protect-non-packs:
    runs-on: ubuntu-latest
    if: 'startsWith(github.head_ref, ''contrib'') || (github.event.pull_request.head.repo.fork == true && contains(github.event.pull_request.base.ref, ''contrib''))'
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@823fcebdb31bb35fdf2229d9f769b400309430d0  # v46.0.3 disable-secrets-detection

      - name: Check for changes in protected paths
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
              python .github/github_workflow_scripts/check_protected_paths.py "$CHANGED_FILES"
